services:
  - type: web
    name: korolko-bot
    env: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn main:app --bind 0.0.0.0:$PORT
    envVars:
      - key: BOT_TOKEN
        sync: false
      - key: WEBHOOK_URL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: ADMIN_CHAT_ID
        sync: false
      # Made Bar: строка подключения к PostgreSQL (см. README, раздел «Made Bar»).
      # Без неё заказы сборок хранятся во временном SQLite-файле и пропадают при деплое.
      - key: DATABASE_URL
        sync: false
      # Необязательно: стоимость основы (шнурок + застёжка), ₽, и лимит бусин на нити.
      - key: MADEBAR_BASE_PRICE
        value: "700"
      - key: MADEBAR_MAX_BEADS
        value: "30"
    # Опционально: платный постоянный диск, чтобы товары и загруженные фото
    # не пропадали при рестарте/редеплое (см. README, раздел "Постоянное хранилище").
    # disk:
    #   name: korolko-data
    #   mountPath: /opt/render/project/src
    #   sizeGB: 1
